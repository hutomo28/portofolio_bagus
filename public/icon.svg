<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22201D" />
      <stop offset="50%" stop-color="#171615" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <!-- Bronze Accent Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BFA8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#C48D75" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5B43" stop-opacity="0.4" />
    </linearGradient>

    <!-- Letter B Luxurious Metallic Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF0E6" />
      <stop offset="30%" stop-color="#E2B7A0" />
      <stop offset="65%" stop-color="#C48D75" />
      <stop offset="100%" stop-color="#9C6246" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Inner subtle border for depth -->
